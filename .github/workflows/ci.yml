name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mothlog
          POSTGRES_PASSWORD: mothlog
          POSTGRES_DB: mothlog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mothlog"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      MOTHLOG_TEST_DATABASE_URL: postgres://mothlog:mothlog@localhost:5432/mothlog_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
