version: 2
# Las versiones mayores (Angular, TypeScript, Node, Postgres…) se suben a mano: suelen pedir cambios en el código.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @angular/compiler-cli 22 pide TypeScript >=6.0 <6.1; quitarlo cuando Angular admita la siguiente.
      - dependency-name: typescript
        versions: [">= 6.1"]
    groups:
      angular:
        patterns: ["@angular/*"]
      web:
        patterns: ["*"]
        exclude-patterns: ["@angular/*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
