services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: intake_errors
      POSTGRES_PASSWORD: intake_errors
      POSTGRES_DB: intake_errors
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intake_errors"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db:
